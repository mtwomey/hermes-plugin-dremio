name: dremio
version: 1.0.0
description: >
  Dremio Cloud catalog navigation and SQL execution via the native Hermes plugin.
  Provides catalog browsing, schema inspection, and async SQL job execution.
provides_tools:
  - dremio_ping
  - dremio_catalog_list
  - dremio_browse
  - dremio_get_schema
  - dremio_run_sql
